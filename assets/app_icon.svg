<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Golden Bowl / Heart Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shield / Aura Glow -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bg-grad)" stroke="#312e81" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle Outer Rim Glow -->
  <rect x="28" y="28" width="456" height="456" rx="100" ry="100" fill="none" stroke="url(#glow-grad)" stroke-width="2"/>

  <!-- Background Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="270" r="110" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Protective Shield Outline (Subtle Tech/Rescue Accent) -->
  <path d="M256 100 L350 145 C350 240, 290 320, 256 350 C222 320, 162 240, 162 145 Z" 
        fill="url(#glow-grad)" opacity="0.25" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Golden Food Cloche / Offering Bowl -->
  <g filter="url(#shadow)">
    <!-- Base Bowl -->
    <path d="M150 270 C150 345, 205 385, 256 385 C307 385, 362 345, 362 270 Z" 
          fill="url(#gold-grad)"/>
    <!-- Bowl Rim / Cloche Rim -->
    <ellipse cx="256" cy="270" rx="106" ry="24" fill="#fbbf24"/>
    <ellipse cx="256" cy="270" rx="98" ry="18" fill="#f59e0b"/>
  </g>

  <!-- Dynamic Food Rescue Leaf (Rising Spirited Organic Sprout) -->
  <g filter="url(#shadow)">
    <!-- Main Upward Leaf -->
    <path d="M256 125 C200 170, 195 245, 256 270 C320 230, 310 160, 256 125 Z" 
          fill="url(#leaf-grad)"/>
    <!-- Leaf Center Stem / Vein -->
    <path d="M256 135 C250 185, 252 235, 256 270" 
          stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Secondary Small Sprout Leaf -->
    <path d="M260 215 C295 190, 335 205, 330 235 C300 245, 275 235, 260 215 Z" 
          fill="#34d399"/>
  </g>

  <!-- Warm Heart / Compassion Center Jewel -->
  <path d="M256 295 C250 285, 235 285, 230 295 C222 308, 256 332, 256 332 C256 332, 290 308, 282 295 C277 285, 262 285, 256 295 Z" 
        fill="#ffffff" opacity="0.9" filter="url(#glow)"/>

  <!-- Modern Sparkles (Freshness & Rescue Speed) -->
  <!-- Top Right Sparkle -->
  <path d="M375 125 Q375 145, 395 145 Q375 145, 375 165 Q375 145, 355 145 Q375 145, 375 125 Z" fill="#38bdf8"/>
  <circle cx="375" cy="145" r="3" fill="#ffffff"/>
  <!-- Top Left Small Star -->
  <circle cx="135" cy="170" r="4" fill="#34d399" opacity="0.8"/>
  <circle cx="385" cy="290" r="3.5" fill="#fbbf24" opacity="0.7"/>

</svg>
